services:
  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: cloudflare-rdp-tunnel

    restart: unless-stopped

    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CF_TUNNEL_TOKEN:?Set CF_TUNNEL_TOKEN in .env}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      TUNNEL_METRICS: "0.0.0.0:2000"

    security_opt:
      - no-new-privileges:true

    read_only: true

    cap_drop:
      - ALL

    tmpfs:
      - /tmp
